      <path transform="translate(226,48) rotate(110) scale(1.8)" class="pet" opacity="1" d="M0 0 C3.2 -1.6 4.8 -5.4 2.8 -8.6 C-0.4 -7.6 -2.2 -3.6 0 0 Z"/><path transform="translate(258,74) rotate(150) scale(1.4)" class="pet" opacity="1" d="M0 0 C3.2 -1.6 4.8 -5.4 2.8 -8.6 C-0.4 -7.6 -2.2 -3.6 0 0 Z"/><path transform="translate(174,40) rotate(200) scale(1.2)" class="pet" opacity="1" d="M0 0 C3.2 -1.6 4.8 -5.4 2.8 -8.6 C-0.4 -7.6 -2.2 -3.6 0 0 Z"/>
    </g>
