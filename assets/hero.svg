<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#AFD8EA"/>
      <stop offset="55%" stop-color="#E9D6E3"/>
      <stop offset="100%" stop-color="#FBE7ED"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CFEAF2"/>
      <stop offset="100%" stop-color="#AFD8EA"/>
    </linearGradient>
    <filter id="blurSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#sky)"/>

  <!-- soft clouds -->
  <g fill="#ffffff" opacity="0.55" filter="url(#blurSoft)">
    <ellipse cx="180" cy="80" rx="120" ry="22"/>
    <ellipse cx="280" cy="60" rx="90" ry="16"/>
    <ellipse cx="1020" cy="70" rx="140" ry="20"/>
    <ellipse cx="930" cy="50" rx="80" ry="14"/>
    <ellipse cx="600" cy="140" rx="110" ry="14" opacity="0.5"/>
  </g>

  <!-- Mt Fuji, framed by the gate -->
  <g opacity="0.75">
    <path d="M 480,300 L 600,110 L 720,300 Z" fill="#9FB4CC"/>
    <path d="M 560,190 L 600,110 L 640,190 C 614,178 586,178 560,190 Z" fill="#FBF7F4"/>
  </g>

  <!-- lake -->
  <rect x="0" y="300" width="1200" height="60" fill="url(#lake)"/>
  <g stroke="#ffffff" stroke-width="2" opacity="0.4">
    <line x1="80" y1="320" x2="220" y2="320"/>
    <line x1="900" y1="335" x2="1080" y2="335"/>
    <line x1="260" y1="345" x2="360" y2="345"/>
    <line x1="820" y1="315" x2="880" y2="315"/>
  </g>

  <!-- foreground ground -->
  <path d="M0,352 C120,340 220,364 360,350 C520,336 640,362 800,348 C920,338 1040,358 1200,346 L1200,420 L0,420 Z" fill="#8FAE7A"/>

  <!-- torii gate -->
  <g>
    <rect x="518" y="150" width="22" height="220" fill="#C97B62"/>
    <rect x="660" y="150" width="22" height="220" fill="#C97B62"/>
    <path d="M 470,120 C 470,108 480,100 494,100 L 706,100 C 720,100 730,108 730,120 L 730,140 C 730,146 724,150 718,150 L 482,150 C 476,150 470,146 470,140 Z" fill="#C97B62"/>
    <rect x="470" y="100" width="260" height="8" fill="#A85F49" opacity="0.6"/>
    <rect x="505" y="178" width="190" height="16" rx="3" fill="#C97B62"/>
    <rect x="594" y="150" width="12" height="28" fill="#A85F49"/>
  </g>

  <!-- falling sakura petals -->
  <g>
    <ellipse cx="470" cy="30" rx="6" ry="4" fill="#F4B8CE">
      <animate attributeName="cy" values="30;380" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="470;520;460;500" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" dur="10s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="740" cy="10" rx="5" ry="3.4" fill="#E8A0C0">
      <animate attributeName="cy" values="10;370" dur="8.5s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="740;700;770;730" dur="8.5s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0.85;0" dur="8.5s" begin="1.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="380" cy="50" rx="5.5" ry="3.6" fill="#F4B8CE">
      <animate attributeName="cy" values="50;390" dur="12s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="380;340;410;370" dur="12s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0" dur="12s" begin="2.4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="800" cy="20" rx="4.5" ry="3" fill="#E8A0C0">
      <animate attributeName="cy" values="20;360" dur="9s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="800;760;820;780" dur="9s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.75;0.75;0" dur="9s" begin="0.6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="330" cy="15" rx="5" ry="3.4" fill="#F4B8CE">
      <animate attributeName="cy" values="15;365" dur="11s" begin="3.6s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="330;370;310;350" dur="11s" begin="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0" dur="11s" begin="3.6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="620" cy="40" rx="6" ry="4" fill="#E8A0C0">
      <animate attributeName="cy" values="40;180" dur="7s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="620;640;600;630" dur="7s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0.85;0" dur="7s" begin="1.8s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- signature -->
  <text x="1160" y="395" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="18" fill="#B4577A" opacity="0.6">volkansync</text>
</svg>
