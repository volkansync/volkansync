    <text x="52" y="136" font-size="15" fill="var(--hsub)">systems that break, and why — now aimed at security &amp; AI safety</text>
    <rect x="48" y="146" width="478" height="36" rx="18" fill="var(--cloud)" opacity="0.88"/><path d="M68 156 l7 6 -7 6" fill="none" stroke="var(--pet)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="opacity" values="1;0.45;1" dur="2.2s" repeatCount="indefinite"/></path><g opacity="0"><animate attributeName="opacity" dur="20s" begin="0s" repeatCount="indefinite" keyTimes="0;0.000;0.035;0.215;0.250;1" values="0;0;1;1;0;0"/><animateTransform attributeName="transform" type="translate" dur="20s" begin="0s" repeatCount="indefinite" keyTimes="0;0.000;0.035;0.215;0.250;1" values="0 7;0 7;0 0;0 0;0 -4;0 -4"/><text x="86" y="170" font-size="16.5" font-weight="600" fill="var(--hink)">You see, but you do not observe.</text></g><g opacity="0"><animate attributeName="opacity" dur="20s" begin="0s" repeatCount="indefinite" keyTimes="0;0.250;0.285;0.465;0.500;1" values="0;0;1;1;0;0"/><animateTransform attributeName="transform" type="translate" dur="20s" begin="0s" repeatCount="indefinite" keyTimes="0;0.250;0.285;0.465;0.500;1" values="0 7;0 7;0 0;0 0;0 -4;0 -4"/><text x="86" y="170" font-size="16.5" font-weight="600" fill="var(--hink)">Eliminate the impossible. Measure what remains.</text></g><g opacity="0"><animate attributeName="opacity" dur="20s" begin="0s" repeatCount="indefinite" keyTimes="0;0.500;0.535;0.715;0.750;1" values="0;0;1;1;0;0"/><animateTransform attributeName="transform" type="translate" dur="20s" begin="0s" repeatCount="indefinite" keyTimes="0;0.500;0.535;0.715;0.750;1" values="0 7;0 7;0 0;0 0;0 -4;0 -4"/><text x="86" y="170" font-size="16.5" font-weight="600" fill="var(--hink)">No talent. Preparation, and the right instrument.</text></g><g opacity="0"><animate attributeName="opacity" dur="20s" begin="0s" repeatCount="indefinite" keyTimes="0;0.750;0.785;0.965;1.000;1" values="0;0;1;1;0;0"/><animateTransform attributeName="transform" type="translate" dur="20s" begin="0s" repeatCount="indefinite" keyTimes="0;0.750;0.785;0.965;1.000;1" values="0 7;0 7;0 0;0 0;0 -4;0 -4"/><text x="86" y="170" font-size="16.5" font-weight="600" fill="var(--hink)">Linux → networks → security → AI security.</text></g>
