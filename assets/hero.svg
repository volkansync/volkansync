<svg width="1000" height="250" viewBox="0 0 1000 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="volkansync — systems that break, and why. A pastel Fuji-and-sakura wallpaper with drifting petals and rotating one-line quotes.">
<defs><style>
      :root{--surf:#262024;--surf2:#322A2F;--surf3:#3E343A;--prim:#56464C;--onprim:#F1E3E7;--onprim2:#D8BFC8;--ink:#ECDFE2;--sub:#AE99A0;--rose:#E5A3C0;--roseink:#E5A3C0;--teal:#7FCBD0;--tealink:#7FCBD0;--coral:#EE9478;--coralink:#EE9478;--line:#443A40;--sky1:#232031;--sky2:#3A2F3F;--cloud:#4A3C50;--fuji:#6E4E5C;--fujid:#5A3F4C;--snow:#CDBAC6;--sea1:#2F5C63;--sea2:#254A50;--branch:#503436;--pet:#B4718F;--moss1:#44543C;--moss2:#37452F;--hink:#ECDFE2;--hsub:#C9B4BB;--disc:#E9DFD3}
      @media (prefers-color-scheme: light){:root{--surf:#F5EBE8;--surf2:#EADAD6;--surf3:#E0CCC8;--prim:#6B585C;--onprim:#F7ECEF;--onprim2:#DCC6CE;--ink:#453A3E;--sub:#715B60;--rose:#D77BA8;--roseink:#A34677;--teal:#4FAEB3;--tealink:#2E7F84;--coral:#DD6A48;--coralink:#B54A2C;--line:#DCC8C4;--sky1:#BFE1EF;--sky2:#EBD9E7;--cloud:#F7E9F0;--fuji:#D98F9C;--fujid:#C57783;--snow:#FBF5F3;--sea1:#7FD0D2;--sea2:#5FB9BE;--branch:#8A5350;--pet:#EFA6C4;--moss1:#9DBA77;--moss2:#7FA25E;--hink:#453A3E;--hsub:#5E4C51;--disc:#F9EFDC}}
      .surf{fill:var(--surf)} .surf2{fill:var(--surf2)} .surf3{fill:var(--surf3)}
      .prim{fill:var(--prim)} .onprim{fill:var(--onprim)} .onprim2{fill:var(--onprim2)}
      .ink{fill:var(--ink)} .sub{fill:var(--sub)}
      .rose{fill:var(--rose)} .roseink{fill:var(--roseink)}
      .teal{fill:var(--teal)} .tealink{fill:var(--tealink)}
      .coral{fill:var(--coral)} .coralink{fill:var(--coralink)}
      .st{fill:none;stroke-linecap:round;stroke-linejoin:round}
      text{font-family:-apple-system,'Segoe UI Variable Text','Segoe UI',Roboto,'Noto Sans',Ubuntu,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    </style></defs>

  <clipPath id="wall"><rect width="1000" height="250" rx="28"/></clipPath>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" style="stop-color:var(--sky1)"/><stop offset="100%" style="stop-color:var(--sky2)"/>
  </linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" style="stop-color:var(--sea1)"/><stop offset="100%" style="stop-color:var(--sea2)"/>
  </linearGradient>
  <g clip-path="url(#wall)">
    <rect width="1000" height="250" fill="url(#sky)"/>
    <circle cx="704" cy="66" r="30" fill="var(--disc)" opacity="0.9"><animate attributeName="opacity" values="0.9;0.72;0.9" dur="11s" repeatCount="indefinite"/></circle>
