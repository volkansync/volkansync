nsform" type="translate" values="0 0;-31 45;-62 90" keyTimes="0;0.55;1" dur="9.0s" begin="-6.8s" repeatCount="indefinite"/><path transform="translate(622,78) rotate(160) scale(1.1)" class="pet" opacity="1" d="M0 0 C3.2 -1.6 4.8 -5.4 2.8 -8.6 C-0.4 -7.6 -2.2 -3.6 0 0 Z"/><animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.75;1" dur="9.0s" begin="-6.8s" repeatCount="indefinite"/></g><g fill="var(--pet)" opacity="0.85"><animateTransform attributeName="transform" type="translate" values="0 0;-39 58;-78 116" keyTimes="0;0.55;1" dur="11.5s" begin="-8.5s" repeatCount="indefinite"/><path transform="translate(749,25) rotate(200) scale(1.35)" class="pet" opacity="1" d="M0 0 C3.2 -1.6 4.8 -5.4 2.8 -8.6 C-0.4 -7.6 -2.2 -3.6 0 0 Z"/><animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.75;1" dur="11.5s" begin="-8.5s" repeatCount="indefinite"/></g><g fill="var(--pet)" opacity="0.85"><animateTransform attributeName="transform" type="translate" values="0 0;-23 71;-46 142" keyTimes="0;0.55;1" dur="14.0s" begin="-10.2s" repeatCount="indefinite"/><path transform="translate(810,62) rotate(240) scale(0.85)" class="pet" opacity="1" d="M0 0 C3.2 -1.6 4.8 -5.4 2.8 -8.6 C-0.4 -7.6 -2.2 -3.6 0 0 Z"/><animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.75;1" dur="14.0s" begin="-10.2s" repeatCount="indefinite"/></g><g fill="var(--pet)" opacity="0.85"><animateTransform attributeName="transform" type="translate" values="0 0;-31 84;-62 168" keyTimes="0;0.55;1" dur="16.5s" begin="-11.9s" repeatCount="indefinite"/><path transform="translate(937,99) rotate(280) scale(1.1)" class="pet" opacity="1" d="M0 0 C3.2 -1.6 4.8 -5.4 2.8 -8.6 C-0.4 -7.6 -2.2 -3.6 0 0 Z"/><animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.75;1" dur="16.5s" begin="-11.9s" repeatCount="indefinite"/></g>
