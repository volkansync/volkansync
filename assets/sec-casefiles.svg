<svg width="900" height="66" viewBox="0 0 900 66" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="[ CASEFILES ] — real failures on real machines">
  <defs>
    <style>
      :root{
        --panel1:#152340; --panel2:#101B32; --edge:#2C3E63;
        --title:#E6CC55; --sub:#94A3BE; --ink:#ECE6D8; --star:#FFF3CE; --glow:#E6CC55; --pill:#1B2A49;
      }
      @media (prefers-color-scheme: light){
        :root{
          --panel1:#FAF4E4; --panel2:#F2E9D2; --edge:#E0D2AC;
          --title:#8A6A16; --sub:#7A6E52; --ink:#3A3016; --star:#B98E25; --glow:#C79A2E; --pill:#F0E6CD;
        }
      }
      #p1{stop-color:var(--panel1)} #p2{stop-color:var(--panel2)}
      #hA{stop-color:var(--glow)} #hB{stop-color:var(--glow)}
      .panel{stroke:var(--edge)} .title{fill:var(--title)} .sub{fill:var(--sub)}
      .ink{fill:var(--ink)} .star{fill:var(--star)} .orbit{stroke:var(--edge);fill:none}
      .glow{fill:var(--glow)} .pillbg{fill:var(--pill);stroke:var(--edge)}
      text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    </style>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop id="p1" offset="0%"/><stop id="p2" offset="100%"/></linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop id="hA" offset="0%" stop-opacity="0.85"/><stop id="hB" offset="100%" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect x="1.2" y="1.2" width="897.6" height="63.6" rx="20" fill="url(#panel)" class="panel" stroke-width="1.3"/>
  <circle cx="40" cy="33.0" r="16" fill="url(#halo)"/>
  <circle cx="40" cy="33.0" r="4.6" class="glow" opacity="0.55" filter="url(#soft)"/>
  <circle cx="40" cy="33.0" r="3" class="star"/>
  <text x="72" y="31.0" font-size="15" letter-spacing="3.5" class="title" font-weight="700">[ CASEFILES ]</text>
  <text x="72" y="49.0" font-size="10.5" class="sub">real failures on real machines</text>
  <g opacity="0.5">
    <path d="M 720 33.0 q 55 -20 110 0" class="orbit" stroke-width="1" stroke-dasharray="2 6"/>
    <circle cx="748" cy="24.0" r="1.7" class="star"/>
    <circle cx="806" cy="22.0" r="2.3" class="star"/>
    <circle cx="856" cy="29.0" r="1.5" class="star"/>
  </g>
</svg>
