  <text x="289" y="131" font-size="9.5" letter-spacing="2" class="sub" text-anchor="end">06</text>
  <text x="289" y="146" font-size="13" font-weight="700" class="ink" text-anchor="end">FIX</text>
  <text x="289" y="162" font-size="10" class="sub" text-anchor="end">with its cost named</text>
  <text x="40" y="52" font-size="13" letter-spacing="4" class="title" font-weight="700">THE METHOD</text>
  <text x="40" y="74" font-size="11.5" class="sub">not a line — an orbit. it circles, and it returns</text>
  <text x="40" y="610" font-size="10.5" class="sub">the loop is not failure — when the instrument lies, you rebuild the instrument</text>
</svg>
