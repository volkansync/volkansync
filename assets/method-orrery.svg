  <text x="500" y="177" font-size="13" font-weight="700" class="ink" text-anchor="start">SYMPTOM</text>
  <text x="500" y="193" font-size="10" class="sub" text-anchor="start">what can be observed</text>
  <circle cx="629" cy="243" r="20" fill="url(#halo)" opacity="0.4" filter="url(#bloom)"/>
