  <text x="268" y="417" font-size="13" font-weight="700" class="ink" text-anchor="end">EVIDENCE</text>
  <text x="268" y="433" font-size="10" class="sub" text-anchor="end">numbers, not impressions</text>
  <circle cx="308" cy="151" r="20" fill="url(#halo)" opacity="0.4" filter="url(#bloom)"/>
  <circle cx="308" cy="151" r="7.2" class="glow" opacity="0.5" filter="url(#soft)"/>
