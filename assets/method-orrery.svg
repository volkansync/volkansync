  <circle class="pulse" r="3.2" filter="url(#soft)"><animateMotion dur="7.2s" begin="0s" repeatCount="indefinite" path="M 500.0 192.0 C 521.5 200.6 605.1 207.4 628.9 243.5 C 652.7 279.5 667.5 363.9 642.6 408.2 C 617.7 452.4 537.7 511.0 479.3 508.9 C 420.9 506.9 320.8 455.5 292.3 395.9 C 263.8 336.3 305.8 192.1 308.5 151.3"/><animate attributeName="opacity" values="0;1;1;0" dur="7.2s" begin="0s" repeatCount="indefinite"/></circle>
  <circle class="pulse" r="3.2" filter="url(#soft)"><animateMotion dur="7.2s" begin="3.6s" repeatCount="indefinite" path="M 500.0 192.0 C 521.5 200.6 605.1 207.4 628.9 243.5 C 652.7 279.5 667.5 363.9 642.6 408.2 C 617.7 452.4 537.7 511.0 479.3 508.9 C 420.9 506.9 320.8 455.5 292.3 395.9 C 263.8 336.3 305.8 192.1 308.5 151.3"/><animate attributeName="opacity" values="0;1;1;0" dur="7.2s" begin="3.6s" repeatCount="indefinite"/></circle>
