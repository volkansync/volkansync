  <text x="664" y="419" font-size="9.5" letter-spacing="2" class="sub" text-anchor="start">03</text>
  <text x="664" y="434" font-size="13" font-weight="700" class="ink" text-anchor="start">MECHANISM</text>
  <text x="664" y="450" font-size="10" class="sub" text-anchor="start">not a guess — a cause</text>
  <circle cx="479" cy="509" r="30" fill="url(#halo)" opacity="0.55" filter="url(#bloom)"/>
