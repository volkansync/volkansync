  <text x="652" y="242" font-size="13" font-weight="700" class="ink" text-anchor="start">ELIMINATE</text>
  <text x="652" y="258" font-size="10" class="sub" text-anchor="start">what it is not</text>
  <circle cx="643" cy="408" r="20" fill="url(#halo)" opacity="0.4" filter="url(#bloom)"/>
  <circle cx="643" cy="408" r="7.2" class="glow" opacity="0.5" filter="url(#soft)"/>
