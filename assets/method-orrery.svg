<svg width="1000" height="640" viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The method drawn as a celestial orrery: six stations — symptom, eliminate, mechanism, falsifiable test, evidence, fix — as stars on an outward spiral, with a return arc.">
  <defs>
    <style>
      :root{
        --sky1:#1A2A4E; --sky2:#070B18; --edge:#33456E;
        --neb1:#E6CC55; --neb2:#6C5B9E;
        --orbit:#33456E; --star:#FFF6D8; --glow:#E6CC55;
        --arc:#E6CC55; --ink:#ECE6D8; --title:#E6CC55; --sub:#9AA6C0;
        --bgstar:#C9D3E8; --loop:#C9A94A;
      }
      @media (prefers-color-scheme: light){
        :root{
          --sky1:#FBF6E6; --sky2:#EDE2C6; --edge:#D8C79B;
          --neb1:#D9B94A; --neb2:#B9A38A;
          --orbit:#D8C79B; --star:#7A5A0C; --glow:#C79A2E;
          --arc:#A9801A; --ink:#3A3016; --title:#8A6A16; --sub:#7A6E52;
          --bgstar:#C7B590; --loop:#8A6A16;
        }
      }
      #sky1{stop-color:var(--sky1)} #sky2{stop-color:var(--sky2)}
      #neb1a{stop-color:var(--neb1)} #neb2a{stop-color:var(--neb2)}
      #arc1{stop-color:var(--arc); stop-opacity:0} #arc2{stop-color:var(--arc); stop-opacity:0.9} #arc3{stop-color:var(--arc); stop-opacity:0.15}
      #haloA{stop-color:var(--glow)} #haloB{stop-color:var(--glow)}
      .orbit{stroke:var(--orbit); fill:none}
      .arc{stroke:url(#arcGrad); fill:none}
      .loop{stroke:var(--loop); fill:none}
      .star{fill:var(--star)} .glow{fill:var(--glow)}
      .ink{fill:var(--ink)} .title{fill:var(--title)} .sub{fill:var(--sub)}
      .bgstar{fill:var(--bgstar)} .loopTip{fill:var(--loop)} .pulse{fill:var(--star)}
      text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    </style>
    <radialGradient id="sky" cx="46%" cy="42%" r="72%">
      <stop id="sky1" offset="0%"/><stop id="sky2" offset="100%"/>
    </radialGradient>
    <radialGradient id="neb1" cx="50%" cy="50%" r="50%">
      <stop id="neb1a" offset="0%" stop-opacity="0.22"/><stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="50%" cy="50%" r="50%">
      <stop id="neb2a" offset="0%" stop-opacity="0.20"/><stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop id="arc1" offset="0%"/><stop id="arc2" offset="55%"/><stop id="arc3" offset="100%"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop id="haloA" offset="0%" stop-opacity="0.9"/><stop id="haloB" offset="100%" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2"/></filter>
    <filter id="bloom" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="9"/></filter>
    <marker id="ltip" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="loopTip" d="M0,1 L9,5 L0,9 z"/></marker>
  </defs>

  <rect width="1000" height="640" fill="url(#sky)"/>

