<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The method: symptom, eliminate, hypothesis, falsifiable test, evidence, fix — with a loop back when the instrument lies">
  <defs>
    <style>
      :root{
        --panelTop:#0E1628; --panelBot:#060A16;
        --ink:#EDE8DA; --gold:#E6CC55; --goldDim:#C4A93F;
        --rail:#2C4570; --muted:#8795AB; --faint:#5C6B85;
        --node:#0E1628;
      }
      @media (prefers-color-scheme: light){
        :root{
          --panelTop:#FBF7EC; --panelBot:#F1E9D4;
          --ink:#1C2B4A; --gold:#A9801A; --goldDim:#8A6A16;
          --rail:#B8842A; --muted:#5C6B85; --faint:#9AA2B4;
          --node:#FBF7EC;
        }
      }
      #panelTop{stop-color:var(--panelTop)} #panelBot{stop-color:var(--panelBot)}
      #railA,#railB,#railC,#railD{stop-color:var(--rail)}
      #moonA,#moonB{stop-color:var(--gold)}
      .ink{fill:var(--ink)} .gold{fill:var(--gold)} .goldDim{fill:var(--goldDim)}
      .muted{fill:var(--muted)} .faint{fill:var(--faint)}
      .node{fill:var(--node); stroke:var(--gold)}
      .nodeActive{fill:var(--gold)}
      .arrow{stroke:var(--gold)} .loop{stroke:var(--goldDim)}
      .rail{stroke:var(--rail)}
      .tip{fill:var(--gold)} .tipDim{fill:var(--goldDim)}
    </style>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop id="panelTop" offset="0%"/>
      <stop id="panelBot" offset="100%"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop id="railA" offset="0%"  stop-opacity="0.25"/>
      <stop id="railB" offset="12%" stop-opacity="1"/>
      <stop id="railC" offset="88%" stop-opacity="1"/>
      <stop id="railD" offset="100%" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop id="moonA" offset="0%"   stop-opacity="0.22"/>
      <stop id="moonB" offset="100%" stop-opacity="0"/>
    </radialGradient>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="tip" d="M0,1 L9,5 L0,9 z"/>
    </marker>
    <marker id="tipDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="tipDim" d="M0,1 L9,5 L0,9 z"/>
    </marker>
  </defs>

  <rect width="1200" height="320" rx="10" fill="url(#panel)"/>
  <circle cx="1040" cy="60" r="150" fill="url(#moon)"/>

  <text x="36" y="42" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="13" letter-spacing="4" class="gold" font-weight="700">THE METHOD</text>
  <text x="36" y="64" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="12" class="muted">every note in this profile follows it</text>

  <line x1="40" y1="140" x2="1160" y2="140" class="rail" stroke="url(#rail)" stroke-width="1.5"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">
    <!-- 01 -->
    <circle cx="100" cy="140" r="7" class="node" stroke-width="2"/>
    <text x="100" y="118" font-size="10" class="goldDim" letter-spacing="2">01</text>
    <text x="100" y="170" font-size="13" class="ink" font-weight="700">SYMPTOM</text>
    <text x="100" y="188" font-size="10.5" class="muted">what can be observed</text>

    <!-- 02 -->
    <circle cx="300" cy="140" r="7" class="node" stroke-width="2"/>
    <text x="300" y="118" font-size="10" class="goldDim" letter-spacing="2">02</text>
    <text x="300" y="170" font-size="13" class="ink" font-weight="700">ELIMINATE</text>
    <text x="300" y="188" font-size="10.5" class="muted">what it is not</text>

    <!-- 03 -->
    <circle cx="500" cy="140" r="7" class="node" stroke-width="2"/>
    <text x="500" y="118" font-size="10" class="goldDim" letter-spacing="2">03</text>
    <text x="500" y="170" font-size="13" class="ink" font-weight="700">MECHANISM</text>
    <text x="500" y="188" font-size="10.5" class="muted">not a guess — a cause</text>

    <!-- 04 -->
    <circle cx="700" cy="140" r="9" class="nodeActive"/>
    <text x="700" y="118" font-size="10" class="gold" letter-spacing="2">04</text>
    <text x="700" y="170" font-size="13" class="gold" font-weight="700">FALSIFIABLE TEST</text>
    <text x="700" y="188" font-size="10.5" class="muted">could prove me wrong</text>

    <!-- 05 -->
    <circle cx="900" cy="140" r="7" class="node" stroke-width="2"/>
    <text x="900" y="118" font-size="10" class="goldDim" letter-spacing="2">05</text>
    <text x="900" y="170" font-size="13" class="ink" font-weight="700">EVIDENCE</text>
    <text x="900" y="188" font-size="10.5" class="muted">numbers, not impressions</text>

    <!-- 06 -->
    <circle cx="1090" cy="140" r="7" class="node" stroke-width="2"/>
    <text x="1090" y="118" font-size="10" class="goldDim" letter-spacing="2">06</text>
    <text x="1090" y="170" font-size="13" class="ink" font-weight="700">FIX</text>
    <text x="1090" y="188" font-size="10.5" class="muted">with its cost named</text>
  </g>

  <g class="arrow" stroke-width="1.6" marker-end="url(#tip)" opacity="0.85">
    <line x1="113" y1="140" x2="281" y2="140"/>
    <line x1="313" y1="140" x2="481" y2="140"/>
    <line x1="513" y1="140" x2="679" y2="140"/>
    <line x1="713" y1="140" x2="881" y2="140"/>
    <line x1="913" y1="140" x2="1071" y2="140"/>
  </g>

  <!-- the loop that matters: the evidence indicts the instrument, not the hypothesis -->
  <path d="M900 210 C 900 262, 700 262, 700 214"
        fill="none" class="loop" stroke-width="1.6"
        stroke-dasharray="5 4" marker-end="url(#tipDim)" opacity="0.95"/>
  <text x="800" y="288" text-anchor="middle"
        font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="11.5" class="goldDim">when the instrument lies, rebuild the instrument</text>

  <text x="36" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="11" class="faint">// the loop is not failure. it is the work.</text>
</svg>
