<svg width="222" height="515" viewBox="0 0 222 515" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Case log as notifications: nine dated decisions, kept even when they read badly later.">
<defs><style>
      :root{--surf:#262024;--surf2:#322A2F;--surf3:#3E343A;--prim:#56464C;--onprim:#F1E3E7;--onprim2:#D8BFC8;--ink:#ECDFE2;--sub:#AE99A0;--rose:#E5A3C0;--roseink:#E5A3C0;--teal:#7FCBD0;--tealink:#7FCBD0;--coral:#EE9478;--coralink:#EE9478;--line:#443A40;}
      @media (prefers-color-scheme: light){:root{--surf:#F5EBE8;--surf2:#EADAD6;--surf3:#E0CCC8;--prim:#6B585C;--onprim:#F7ECEF;--onprim2:#DCC6CE;--ink:#453A3E;--sub:#715B60;--rose:#D77BA8;--roseink:#A34677;--teal:#4FAEB3;--tealink:#2E7F84;--coral:#DD6A48;--coralink:#B54A2C;--line:#DCC8C4;}}
      .surf{fill:var(--surf)} .surf2{fill:var(--surf2)} .surf3{fill:var(--surf3)}
      .prim{fill:var(--prim)} .onprim{fill:var(--onprim)} .onprim2{fill:var(--onprim2)}
      .ink{fill:var(--ink)} .sub{fill:var(--sub)}
      .rose{fill:var(--rose)} .roseink{fill:var(--roseink)}
      .teal{fill:var(--teal)} .tealink{fill:var(--tealink)}
      .coral{fill:var(--coral)} .coralink{fill:var(--coralink)}
      .st{fill:none;stroke-linecap:round;stroke-linejoin:round}
      text{font-family:-apple-system,'Segoe UI Variable Text','Segoe UI',Roboto,'Noto Sans',Ubuntu,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    </style></defs>
<rect width="222" height="515" rx="20" class="surf"/>
  <g transform="translate(16,14) scale(0.85)"><path d="M10 3a5 5 0 0 1 5 5v3.2l1.8 2.8H3.2L5 11.2V8a5 5 0 0 1 5-5z" class="st" stroke="var(--roseink)" stroke-width="1.8"/><path d="M8.4 16.8a1.8 1.8 0 0 0 3.2 0" class="st" stroke="var(--roseink)" stroke-width="1.8"/></g>
  <text x="40" y="27" font-size="12.5" font-weight="800" class="ink">case log</text>
  <text x="16" y="45" font-size="8.5" class="sub">decisions that were expensive to make</text>
  <rect x="182" y="14" width="24" height="18" rx="9.0" class="surf3"/><text x="194.0" y="26.2" font-size="9" class="sub mono" text-anchor="middle" letter-spacing="0.3">9</text>
  <rect x="10" y="56" width="202" height="42" rx="13" class="surf2"/>
  <text x="22" y="74" font-size="10.5" font-weight="700" class="ink">Main track → AI security</text>
  <text x="22" y="88" font-size="9" class="sub">the gap between security and ML</text>
  <text x="202" y="73" font-size="7.5" class="sub mono" text-anchor="end">2026-09</text>
  <rect x="10" y="105" width="202" height="42" rx="13" class="surf2"/>
  <text x="22" y="123" font-size="10.5" font-weight="700" class="ink">Python over Rust</text>
  <text x="22" y="137" font-size="9" class="sub">ML lives in Python</text>
  <text x="202" y="122" font-size="7.5" class="sub mono" text-anchor="end">2026-09</text>
  <rect x="10" y="154" width="202" height="42" rx="13" class="surf2"/>
  <text x="22" y="172" font-size="10.5" font-weight="700" class="ink">Pipeline paused at TTS</text>
  <text x="22" y="186" font-size="9" class="sub">I could hear it was bad</text>
  <text x="202" y="171" font-size="7.5" class="sub mono" text-anchor="end">2026-09</text>
  <rect x="10" y="203" width="202" height="42" rx="13" class="surf2"/>
  <text x="22" y="221" font-size="10.5" font-weight="700" class="ink">Closed the web agency</text>
  <text x="22" y="235" font-size="9" class="sub">fixed costs compounded monthly</text>
  <text x="202" y="220" font-size="7.5" class="sub mono" text-anchor="end">2026-09</text>
  <rect x="10" y="252" width="202" height="42" rx="13" class="surf2"/>
  <text x="22" y="270" font-size="10.5" font-weight="700" class="ink">Nothing new until it ships</text>
  <text x="22" y="284" font-size="9" class="sub">18 categories, free rivals in all</text>
  <text x="202" y="269" font-size="7.5" class="sub mono" text-anchor="end">2026-09</text>
  <rect x="10" y="301" width="202" height="42" rx="13" class="surf2"/>
  <text x="22" y="319" font-size="10.5" font-weight="700" class="ink">Deterministic default</text>
  <text x="22" y="333" font-size="9" class="sub">must work when credit runs out</text>
  <text x="202" y="318" font-size="7.5" class="sub mono" text-anchor="end">2026-09</text>
  <rect x="10" y="350" width="202" height="42" rx="13" class="surf2"/>
  <text x="22" y="368" font-size="10.5" font-weight="700" class="ink">One repo · deploy · DB</text>
  <text x="22" y="382" font-size="9" class="sub">a failure must not spread</text>
  <text x="202" y="367" font-size="7.5" class="sub mono" text-anchor="end">2026-09</text>
  <rect x="10" y="399" width="202" height="42" rx="13" class="surf2"/>
  <text x="22" y="417" font-size="10.5" font-weight="700" class="ink">Wayfire · Quickshell</text>
  <text x="22" y="431" font-size="9" class="sub">plugin architecture over polish</text>
  <text x="202" y="416" font-size="7.5" class="sub mono" text-anchor="end">2026-07</text>
  <rect x="10" y="448" width="202" height="42" rx="13" class="surf2"/>
  <text x="22" y="466" font-size="10.5" font-weight="700" class="ink">C# = coursework only</text>
  <text x="22" y="480" font-size="9" class="sub">passing is the entire goal</text>
  <text x="202" y="465" font-size="7.5" class="sub mono" text-anchor="end">2026-07</text>
  <text x="111.0" y="506" font-size="8.5" class="sub" text-anchor="middle">kept even when they read badly later</text>
</svg>
