<svg width="444" height="726" viewBox="0 0 444 726" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Case log as notifications: nine dated decisions, kept even when they read badly later.">
<defs><style>
      :root{--surf:#262024;--surf2:#322A2F;--surf3:#3E343A;--prim:#56464C;--onprim:#F1E3E7;--ink:#ECDFE2;--sub:#AE99A0;--rose:#E5A3C0;--roseink:#E5A3C0;--teal:#7FCBD0;--tealink:#7FCBD0;--coral:#EE9478;--coralink:#EE9478;--line:#443A40;}
      @media (prefers-color-scheme: light){:root{--surf:#F5EBE8;--surf2:#EADAD6;--surf3:#E0CCC8;--prim:#6B585C;--onprim:#F7ECEF;--ink:#453A3E;--sub:#715B60;--rose:#D77BA8;--roseink:#A34677;--teal:#4FAEB3;--tealink:#2E7F84;--coral:#DD6A48;--coralink:#B54A2C;--line:#DCC8C4;}}
      .surf{fill:var(--surf)} .surf2{fill:var(--surf2)} .surf3{fill:var(--surf3)}
      .prim{fill:var(--prim)} .onprim{fill:var(--onprim)}
      .ink{fill:var(--ink)} .sub{fill:var(--sub)}
      .rose{fill:var(--rose)} .roseink{fill:var(--roseink)}
      .teal{fill:var(--teal)} .tealink{fill:var(--tealink)}
      .coral{fill:var(--coral)} .coralink{fill:var(--coralink)}
      .st{fill:none;stroke-linecap:round;stroke-linejoin:round}
      text{font-family:-apple-system,'Segoe UI Variable Text','Segoe UI',Roboto,'Noto Sans',Ubuntu,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    </style></defs>
<rect width="444" height="726" rx="30" class="surf"/>
  <g transform="translate(32,26) scale(1.05)"><path d="M10 3a5 5 0 0 1 5 5v3.2l1.8 2.8H3.2L5 11.2V8a5 5 0 0 1 5-5z" class="st" stroke="var(--roseink)" stroke-width="1.8"/><path d="M8.4 16.8a1.8 1.8 0 0 0 3.2 0" class="st" stroke="var(--roseink)" stroke-width="1.8"/></g>
  <text x="62" y="42" font-size="15" font-weight="800" class="ink">case log</text>
  <text x="32" y="66" font-size="10.5" class="sub">decisions that were expensive to make</text>
  <rect x="380" y="26" width="30" height="22" rx="11.0" class="surf3"/><text x="395.0" y="40.6" font-size="10" class="sub mono" text-anchor="middle" letter-spacing="0.5">9</text>
  <rect x="20" y="88" width="404" height="58" rx="18" class="surf2"/>
  <text x="38" y="112" font-size="12" font-weight="700" class="ink">Main track moved to AI security</text>
  <text x="38" y="130" font-size="9.8" class="sub">the interesting gap is between security and ML</text>
  <text x="406" y="112" font-size="8.5" class="sub mono" text-anchor="end" opacity="0.85">2026-09</text>
  <rect x="20" y="156" width="404" height="58" rx="18" class="surf2"/>
  <text x="38" y="180" font-size="12" font-weight="700" class="ink">Python over Rust as primary</text>
  <text x="38" y="198" font-size="9.8" class="sub">ML lives in Python; Rust keeps systems &amp; tooling</text>
  <text x="406" y="180" font-size="8.5" class="sub mono" text-anchor="end" opacity="0.85">2026-09</text>
  <rect x="20" y="224" width="404" height="58" rx="18" class="surf2"/>
  <text x="38" y="248" font-size="12" font-weight="700" class="ink">Video pipeline paused at TTS</text>
  <text x="38" y="266" font-size="9.8" class="sub">I could hear it was bad — so it did not ship</text>
  <text x="406" y="248" font-size="8.5" class="sub mono" text-anchor="end" opacity="0.85">2026-09</text>
  <rect x="20" y="292" width="404" height="58" rx="18" class="surf2"/>
  <text x="38" y="316" font-size="12" font-weight="700" class="ink">Closed the web agency</text>
  <text x="38" y="334" font-size="9.8" class="sub">no revenue; fixed costs compounded monthly</text>
  <text x="406" y="316" font-size="8.5" class="sub mono" text-anchor="end" opacity="0.85">2026-09</text>
  <rect x="20" y="360" width="404" height="58" rx="18" class="surf2"/>
  <text x="38" y="384" font-size="12" font-weight="700" class="ink">Nothing new until it ships</text>
  <text x="38" y="402" font-size="9.8" class="sub">18 categories scanned — a free competitor in every one</text>
  <text x="406" y="384" font-size="8.5" class="sub mono" text-anchor="end" opacity="0.85">2026-09</text>
  <rect x="20" y="428" width="404" height="58" rx="18" class="surf2"/>
  <text x="38" y="452" font-size="12" font-weight="700" class="ink">Deterministic default, AI optional</text>
  <text x="38" y="470" font-size="9.8" class="sub">it must still work when the API credit runs out</text>
  <text x="406" y="452" font-size="8.5" class="sub mono" text-anchor="end" opacity="0.85">2026-09</text>
  <rect x="20" y="496" width="404" height="58" rx="18" class="surf2"/>
  <text x="38" y="520" font-size="12" font-weight="700" class="ink">One repo, one deploy, one DB</text>
  <text x="38" y="538" font-size="9.8" class="sub">a failure in one must not take down another</text>
  <text x="406" y="520" font-size="8.5" class="sub mono" text-anchor="end" opacity="0.85">2026-09</text>
  <rect x="20" y="564" width="404" height="58" rx="18" class="surf2"/>
  <text x="38" y="588" font-size="12" font-weight="700" class="ink">Wayfire · Quickshell</text>
  <text x="38" y="606" font-size="9.8" class="sub">plugin architecture over polish</text>
  <text x="406" y="588" font-size="8.5" class="sub mono" text-anchor="end" opacity="0.85">2026-07</text>
  <rect x="20" y="632" width="404" height="58" rx="18" class="surf2"/>
  <text x="38" y="656" font-size="12" font-weight="700" class="ink">C# scoped to coursework only</text>
  <text x="38" y="674" font-size="9.8" class="sub">deliberately off-track; passing is the entire goal</text>
  <text x="406" y="656" font-size="8.5" class="sub mono" text-anchor="end" opacity="0.85">2026-07</text>
  <text x="222.0" y="712" font-size="10" class="sub" text-anchor="middle" opacity="0.9">kept even when they read badly later</text>
</svg>
