<svg width="900" height="446" viewBox="0 0 900 446" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="I fix systems by finding out why they broke. 152.5 to 18.3 failures per day on the same network.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0%"   stop-color="#101B2E"/>
    <stop offset="55%"  stop-color="#0A1120"/>
    <stop offset="100%" stop-color="#05080F"/>
  </linearGradient>
  <radialGradient id="moon" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#E6CC55" stop-opacity="0.20"/>
    <stop offset="50%"  stop-color="#E6CC55" stop-opacity="0.055"/>
    <stop offset="100%" stop-color="#E6CC55" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"  stop-color="#E6CC55" stop-opacity="0.55"/>
    <stop offset="70%" stop-color="#1C2B4A" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#1C2B4A" stop-opacity="0"/>
  </linearGradient>
</defs>

<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .big  { font-size: 34px;  fill: #EDE8DA; font-weight: 700; letter-spacing: -0.6px; }
  .sub  { font-size: 14px;  fill: #7C8BA3; }
  .lab  { font-size: 10px;  letter-spacing: 4px; fill: #C4A93F; font-weight: 700; }
  .num  { font-size: 56px;  fill: #E6CC55; font-weight: 700; letter-spacing: -1px; }
  .cap  { font-size: 12.5px; fill: #8B98AD; }
  .capd { font-size: 12.5px; fill: #5A687F; }
</style>

<rect width="900" height="446" rx="10" fill="url(#bg)"/>
<circle cx="790" cy="-20" r="260" fill="url(#moon)"/>

<text class="big" x="58" y="108">I fix systems by finding out</text>
<text class="big" x="58" y="152">why they broke.</text>

<text class="sub" x="58" y="196">No degree. No early start. No one to ask —</text>
<text class="sub" x="58" y="218">just a machine that kept failing, and a refusal to accept</text>
<text class="sub" x="58" y="240" fill="#A9B4C6" font-style="italic">“it works now”</text>
<text class="sub" x="188" y="240">as an explanation.</text>

<line x1="58" y1="286" x2="842" y2="286" stroke="url(#hair)" stroke-width="1.2"/>

<text class="lab" x="58" y="322">CASE 001 · BLUETOOTH DROPOUTS</text>

<text class="num" x="58" y="388">152.5</text>
<text class="num" x="242" y="382" fill="#C4A93F" font-size="30">→</text>
<text class="num" x="292" y="388">18.3</text>

<text class="cap"  x="470" y="374">failures per day, same network</text>
<text class="capd" x="470" y="396">4 months of journal data · 10 days at exactly zero</text>

<text class="capd" x="842" y="322" text-anchor="end">after ruling out the headphones, the codec, and “just use 5 GHz”</text>
</svg>
