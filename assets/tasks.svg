<svg width="222" height="232" viewBox="0 0 222 232" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="In training: German to B1, Python as primary language, ML fundamentals, RHCSA/LFCS queued, Rust secondary.">
<defs><style>
      :root{--surf:#262024;--surf2:#322A2F;--surf3:#3E343A;--prim:#56464C;--onprim:#F1E3E7;--onprim2:#D8BFC8;--ink:#ECDFE2;--sub:#AE99A0;--rose:#E5A3C0;--roseink:#E5A3C0;--teal:#7FCBD0;--tealink:#7FCBD0;--coral:#EE9478;--coralink:#EE9478;--line:#443A40;}
      @media (prefers-color-scheme: light){:root{--surf:#F5EBE8;--surf2:#EADAD6;--surf3:#E0CCC8;--prim:#6B585C;--onprim:#F7ECEF;--onprim2:#DCC6CE;--ink:#453A3E;--sub:#715B60;--rose:#D77BA8;--roseink:#A34677;--teal:#4FAEB3;--tealink:#2E7F84;--coral:#DD6A48;--coralink:#B54A2C;--line:#DCC8C4;}}
      .surf{fill:var(--surf)} .surf2{fill:var(--surf2)} .surf3{fill:var(--surf3)}
      .prim{fill:var(--prim)} .onprim{fill:var(--onprim)} .onprim2{fill:var(--onprim2)}
      .ink{fill:var(--ink)} .sub{fill:var(--sub)}
      .rose{fill:var(--rose)} .roseink{fill:var(--roseink)}
      .teal{fill:var(--teal)} .tealink{fill:var(--tealink)}
      .coral{fill:var(--coral)} .coralink{fill:var(--coralink)}
      .st{fill:none;stroke-linecap:round;stroke-linejoin:round}
      text{font-family:-apple-system,'Segoe UI Variable Text','Segoe UI',Roboto,'Noto Sans',Ubuntu,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    </style></defs>
<rect width="222" height="232" rx="20" class="surf"/>
  <text x="18" y="26" font-size="12.5" font-weight="800" class="ink">in training</text>
  <text x="18" y="41" font-size="8.5" class="sub">carried until earned — queued means queued</text>
  <circle cx="26" cy="62" r="5.5" fill="none" stroke="var(--line)" stroke-width="2.2"/>
  <g><animateTransform attributeName="transform" type="rotate" values="0 26 62;360 26 62" dur="7.0s" repeatCount="indefinite"/><path d="M26 56.5 A5.5 5.5 0 0 1 31.5 62" fill="none" stroke="var(--roseink)" stroke-width="2.2" stroke-linecap="round"/></g>
  <text x="42" y="63" font-size="11" font-weight="700" class="ink">German → B1</text>
  <text x="42" y="76" font-size="8.5" class="sub">daily, no exceptions</text>
  <rect x="166.4" y="54" width="39.599999999999994" height="16" rx="8.0" class="surf3"/><text x="186.2" y="64.9" font-size="8" class="sub mono" text-anchor="middle" letter-spacing="0.3">active</text>
  <circle cx="26" cy="96" r="5.5" fill="none" stroke="var(--line)" stroke-width="2.2"/>
  <g><animateTransform attributeName="transform" type="rotate" values="0 26 96;360 26 96" dur="8.4s" repeatCount="indefinite"/><path d="M26 90.5 A5.5 5.5 0 0 1 31.5 96" fill="none" stroke="var(--roseink)" stroke-width="2.2" stroke-linecap="round"/></g>
  <text x="42" y="97" font-size="11" font-weight="700" class="ink">Python, properly</text>
  <text x="42" y="110" font-size="8.5" class="sub">now the primary language</text>
  <rect x="166.4" y="88" width="39.599999999999994" height="16" rx="8.0" class="surf3"/><text x="186.2" y="98.9" font-size="8" class="sub mono" text-anchor="middle" letter-spacing="0.3">active</text>
  <circle cx="26" cy="130" r="5.5" fill="none" stroke="var(--line)" stroke-width="2.2"/>
  <g><animateTransform attributeName="transform" type="rotate" values="0 26 130;360 26 130" dur="9.8s" repeatCount="indefinite"/><path d="M26 124.5 A5.5 5.5 0 0 1 31.5 130" fill="none" stroke="var(--roseink)" stroke-width="2.2" stroke-linecap="round"/></g>
  <text x="42" y="131" font-size="11" font-weight="700" class="ink">ML fundamentals</text>
  <text x="42" y="144" font-size="8.5" class="sub">break it, then build it</text>
  <rect x="166.4" y="122" width="39.599999999999994" height="16" rx="8.0" class="surf3"/><text x="186.2" y="132.9" font-size="8" class="sub mono" text-anchor="middle" letter-spacing="0.3">active</text>
  <circle cx="26" cy="164" r="5.5" fill="none" stroke="var(--sub)" stroke-width="1.8" stroke-dasharray="2 2.8"/>
  <text x="42" y="165" font-size="11" font-weight="700" class="ink">RHCSA / LFCS</text>
  <text x="42" y="178" font-size="8.5" class="sub">first certification up</text>
  <rect x="166.4" y="156" width="39.599999999999994" height="16" rx="8.0" class="surf3"/><text x="186.2" y="166.9" font-size="8" class="sub mono" text-anchor="middle" letter-spacing="0.3">queued</text>
  <circle cx="26" cy="198" r="3.2" class="surf3"/>
  <text x="42" y="199" font-size="11" font-weight="700" class="ink">Rust</text>
  <text x="42" y="212" font-size="8.5" class="sub">systems &amp; tooling only</text>
  <rect x="175.6" y="190" width="30.4" height="16" rx="8.0" class="surf3"/><text x="190.79999999999998" y="200.9" font-size="8" class="sub mono" text-anchor="middle" letter-spacing="0.3">side</text>
</svg>
