<svg width="1000" height="540" viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The method as a mind: on the left the six steps — symptom, eliminate, mechanism, falsifiable test, evidence, fix — and on the right a brain whose neurons fire the same sequence, with a red feedback loop.">
  <defs>
    <style>
      :root{
        --bg1:#0C1E36; --bg2:#060E1C; --glass:#12294A;
        --syn:#3B6690; --synHi:#6FB4E8; --sig:#DCEEFF;
        --neuron:#BFE3FF; --halo:#5AA6E6; --ink:#DCE8F2; --title:#8FD0FF; --sub:#7F95AC;
        --fire:#FF5A3C; --fireGlow:#FF7A4A; --stroke:#4F7EA8; --brainFill:#123A63; --rule:#26466E;
      }
      @media (prefers-color-scheme: light){
        :root{
          --bg1:#EAF4FC; --bg2:#DAEAF7; --glass:#F5FBFF;
          --syn:#A7C9E6; --synHi:#4E93C8; --sig:#1E6FB0;
          --neuron:#2E7DB8; --halo:#8CC0E6; --ink:#1E3A52; --title:#155F9E; --sub:#5B738A;
          --fire:#E23B1E; --fireGlow:#F0613F; --stroke:#7FAAD0; --brainFill:#CFE6F7; --rule:#CBDCEC;
        }
      }
      #bg1{stop-color:var(--bg1)} #bg2{stop-color:var(--bg2)}
      #glA{stop-color:var(--glass)} #haA{stop-color:var(--halo)} #haB{stop-color:var(--halo)}
      #fiA{stop-color:var(--fireGlow)} #fiB{stop-color:var(--fireGlow)}
      .syn{stroke:var(--syn);fill:none} .synHi{stroke:var(--synHi);fill:none}
      .sig{fill:var(--sig)} .neuron{fill:var(--neuron)} .ink{fill:var(--ink)}
      .title{fill:var(--title)} .sub{fill:var(--sub)} .rule{stroke:var(--rule)}
      .fire{fill:var(--fire)} .fireStroke{stroke:var(--fire);fill:none}
      .brain{fill:var(--brainFill);stroke:var(--stroke)} .fold{stroke:var(--stroke);fill:none}
      text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    </style>
    <radialGradient id="bg" cx="50%" cy="36%" r="80%"><stop id="bg1" offset="0%"/><stop id="bg2" offset="100%"/></radialGradient>
    <radialGradient id="glass" cx="40%" cy="6%" r="60%"><stop id="glA" offset="0%" stop-opacity="0.45"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop id="haA" offset="0%" stop-opacity="0.85"/><stop id="haB" offset="100%" stop-opacity="0"/></radialGradient>
    <radialGradient id="fireHalo" cx="50%" cy="50%" r="50%"><stop id="fiA" offset="0%" stop-opacity="0.9"/><stop id="fiB" offset="100%" stop-opacity="0"/></radialGradient>
