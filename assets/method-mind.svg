  <rect width="1000" height="540" fill="url(#glass)"/>

  <line x1="470" y1="70" x2="470" y2="480" class="rule" stroke-width="1" opacity="0.4" stroke-dasharray="2 8"/>

  <text x="46" y="60" font-size="14" letter-spacing="4" class="title" font-weight="700">THE METHOD</text>
  <text x="46" y="82" font-size="11" class="sub">a mind, not a line — it fires, and it feeds back</text>
  <line x1="58" y1="124" x2="58" y2="434" class="rule" stroke-width="1.4" opacity="0.5"/>
  <circle cx="58" cy="134" r="4" class="neuron"/>
  <text x="80" y="130" font-size="10" letter-spacing="2" class="sub">01</text>
  <text x="80" y="147" font-size="15" font-weight="700" class="ink">SYMPTOM</text>
  <text x="80" y="164" font-size="10.5" class="sub">what can be observed</text>
  <circle cx="58" cy="192" r="4" class="neuron"/>
  <text x="80" y="188" font-size="10" letter-spacing="2" class="sub">02</text>
  <text x="80" y="205" font-size="15" font-weight="700" class="ink">ELIMINATE</text>
  <text x="80" y="222" font-size="10.5" class="sub">what it is not</text>
  <circle cx="58" cy="250" r="4" class="neuron"/>
  <text x="80" y="246" font-size="10" letter-spacing="2" class="sub">03</text>
  <text x="80" y="263" font-size="15" font-weight="700" class="ink">MECHANISM</text>
  <text x="80" y="280" font-size="10.5" class="sub">not a guess — a cause</text>
  <circle cx="58" cy="308" r="5" class="fire"/>
  <text x="80" y="304" font-size="10" letter-spacing="2" class="fire">04</text>
  <text x="80" y="321" font-size="15" font-weight="700" class="fire">FALSIFIABLE TEST</text>
  <text x="80" y="338" font-size="10.5" class="sub">could prove me wrong</text>
  <circle cx="58" cy="366" r="4" class="neuron"/>
  <text x="80" y="362" font-size="10" letter-spacing="2" class="sub">05</text>
  <text x="80" y="379" font-size="15" font-weight="700" class="ink">EVIDENCE</text>
  <text x="80" y="396" font-size="10.5" class="sub">numbers, not impressions</text>
  <circle cx="58" cy="424" r="4" class="neuron"/>
  <text x="80" y="420" font-size="10" letter-spacing="2" class="sub">06</text>
  <text x="80" y="437" font-size="15" font-weight="700" class="ink">FIX</text>
  <text x="80" y="454" font-size="10.5" class="sub">with its cost named</text>
