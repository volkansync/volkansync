<svg width="444" height="292" viewBox="0 0 444 292" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="volkansync — Volkan Çevik, Eskişehir TR. Systems that break and why; now aimed at security and AI safety. No degree, no early start, a machine that kept failing.">
<defs><style>
      :root{--surf:#262024;--surf2:#322A2F;--surf3:#3E343A;--prim:#56464C;--onprim:#F1E3E7;--ink:#ECDFE2;--sub:#AE99A0;--rose:#E5A3C0;--roseink:#E5A3C0;--teal:#7FCBD0;--tealink:#7FCBD0;--coral:#EE9478;--coralink:#EE9478;--line:#443A40;}
